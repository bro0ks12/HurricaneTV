name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Fetch ffmpeg (bundled converter)
        run: node scripts/fetch-ffmpeg.mjs
      - name: Release notes
        id: notes
        shell: bash
        run: |
          f="release-notes/${{ github.ref_name }}.md"
          {
            echo 'body<<NOTES_EOF'
            if [ -f "$f" ]; then cat "$f"; else echo 'Descarrega o instalador `HurricaneTV_*_x64-setup.exe`.'; fi
            echo
            echo 'Quem já tem a app recebe aviso de atualização automaticamente.'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HurricaneTV ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
