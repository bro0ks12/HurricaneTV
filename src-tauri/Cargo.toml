[package]
name = "hurricanetv"
version = "0.5.0"
description = "HurricaneTV - IPTV player"
edition = "2021"

[lib]
name = "hurricanetv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "deflate"] }
url = "2"
flate2 = "1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
